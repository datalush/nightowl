apiVersion: fluss.datalush.com/v1alpha1
kind: FlussCluster
metadata:
  name: rustfs-lab
  namespace: data
spec:
  version: "1.0.0"
  image:
    repository: apache/fluss
    pullPolicy: IfNotPresent
  zookeeper:
    addresses:
      - zk-zookeeper.fluss.svc.cluster.local:2181
    pathRoot: /fluss/data/rustfs-lab
  coordinator:
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
    jvm:
      heap: 512Mi
  tabletServers:
    replicas: 3
    resources:
      requests: { cpu: "1", memory: "2Gi" }
    jvm:
      heap: 1Gi
    storage:
      size: 5Gi
    scheduling:
      spreadAcrossNodes: true
  listeners:
    internal: { name: INTERNAL, port: 9123 }
    client: { name: CLIENT, port: 9124, serviceType: ClusterIP }
  podDisruptionBudget:
    tabletServers: { enabled: true, maxUnavailable: 0 }
  scaleIn:
    onNonEmptyTabletServer: Block
  remoteStorage:
    s3:
      bucket: fluss-lab
      prefix: clusters/data/rustfs-lab
      region: us-east-1
      # Placeholder: replace with your S3-compatible endpoint. Never commit
      # real infrastructure addresses or credentials here.
      endpoint: http://s3-compatible.example.internal:9000
      pathStyleAccess: true
      authentication:
        type: secret
        secretRef:
          name: fluss-rustfs
          accessKeyKey: access-key
          secretKeyKey: secret-key
